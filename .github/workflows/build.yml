name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request or push that only touches docs, the CHANGELOG, the install page or other workflows skips the build (the
# job still runs and passes: `apk` is a required check, and a required check that never reports blocks the merge).
# A new push to a pull request cancels its build still running; builds of main all finish.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2               # enough to tell what the change touched (.github/scripts/affects.sh)
          persist-credentials: false   # the build never pushes: don't leave the token in .git/config

      - name: Does this change affect the build?
        id: changes
        run: .github/scripts/affects.sh '^(app/|build\.sh$|config\.example\.properties$|\.github/scripts/|\.github/workflows/build\.yml$)' | tee -a "$GITHUB_OUTPUT"

      - name: Nothing the app is built from changed
        if: steps.changes.outputs.app != 'true'
        run: echo "Nothing the app is built from changed, so the build is skipped." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.app == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        if: steps.changes.outputs.app == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Release script tests
        if: steps.changes.outputs.app == 'true'
        run: python3 -m unittest discover -s .github/scripts

      - name: Build and unit tests
        if: steps.changes.outputs.app == 'true'
        run: ./build.sh

      # Marquise has to stay light (README: "under 1 MB"): a change that makes the APK grow past it needs a reason.
      - name: APK size budget
        if: steps.changes.outputs.app == 'true'
        env:
          MAX_BYTES: "1000000"
        run: |
          size=$(stat -c %s marquise.apk)
          echo "marquise.apk: $size bytes (budget $MAX_BYTES)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$size" -le "$MAX_BYTES" ] || { echo "::error::marquise.apk is $size bytes, over the $MAX_BYTES budget"; exit 1; }

      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.app == 'true'
        with:
          name: marquise-apk
          path: marquise.apk
          retention-days: 14
