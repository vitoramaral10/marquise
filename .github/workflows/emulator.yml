name: Emulator

# Every pull request switches Marquise on and back off on a Google TV emulator (tools/emulator_check.sh): the home
# screen, the screensaver and the apps turned off, then all three back as they were. The screenshots of Home, the
# memory it uses and the log are kept as the run's artifact. A change that touches nothing the app or the check are
# made of (docs, the CHANGELOG, the install page, other workflows) skips the emulator: the job still runs and passes,
# because `emulator` is a required check and one that never reports blocks the merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: system-images;android-34;google-tv;x86
  # One place for the AVD: avdmanager and the emulator don't look in the same default folder.
  ANDROID_AVD_HOME: /home/runner/.android/avd

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # enough to tell what the change touched (.github/scripts/affects.sh)
          persist-credentials: false

      - name: Does this change affect the app or the check?
        id: changes
        env:
          # On a push, everything since main was last at; on a pull request, empty (the merge's first parent).
          AFFECTS_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: .github/scripts/affects.sh '^(app/|build\.sh$|config\.example\.properties$|tools/emulator_check\.sh$|\.github/workflows/emulator\.yml$|\.github/scripts/affects\.sh$)' | tee -a "$GITHUB_OUTPUT"

      - name: Nothing the app or the check is made of changed
        if: steps.changes.outputs.app != 'true'
        run: echo "Nothing the app or the check is made of changed, so the emulator is skipped." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.app == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: KVM
        if: steps.changes.outputs.app == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Google TV image (cached)
        if: steps.changes.outputs.app == 'true'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google-tv/x86   # $ANDROID_HOME on GitHub's runners
          key: google-tv-34-x86-r3

      - name: Android SDK packages
        if: steps.changes.outputs.app == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" emulator \
            platform-tools "$IMAGE" > /dev/null

      # A placeholder Jellyfin (nothing answers there): the setup is skipped, and Home shows its empty posters.
      - name: Build
        if: steps.changes.outputs.app == 'true'
        run: |
          sed -e 's#^jellyfin_url=.*#jellyfin_url=http://127.0.0.1:8096#' -e 's#^jellyfin_key=.*#jellyfin_key=emulator-check#' \
            config.example.properties > config.properties
          ./build.sh

      - name: Start the emulator
        if: steps.changes.outputs.app == 'true'
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          adb="$ANDROID_HOME/platform-tools/adb"
          # The emulator lets this computer's adb key into the device when it starts. If the key doesn't exist yet
          # (the first adb server makes it), the device answers "unauthorized" for the whole boot and the step times
          # out: it did, now and then. So the key and the server come first.
          "$adb" kill-server || true
          [ -f "$HOME/.android/adbkey" ] || "$adb" keygen "$HOME/.android/adbkey"
          "$adb" start-server
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n check -k "$IMAGE" -d tv_1080p
          "$ANDROID_HOME/emulator/emulator" -avd check -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 -cores 2 -port 5560 > emulator.log 2>&1 &
          emu=$!
          booted=
          unauthorized=0
          for i in $(seq 1 100); do   # up to ~5 minutes
            if ! kill -0 "$emu" 2>/dev/null; then echo "::error::the emulator quit"; cat emulator.log; exit 1; fi
            booted=$(timeout 5 "$adb" -s emulator-5560 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') || true
            [ "$booted" = 1 ] && break
            # Still unauthorized after half a minute: the key was missed, start the server again (it asks anew).
            if [ "$(timeout 5 "$adb" -s emulator-5560 get-state 2>&1 | grep -c unauthorized)" = 1 ]; then
              unauthorized=$((unauthorized + 1))
              if [ "$unauthorized" -ge 10 ]; then
                echo "::warning::the emulator is unauthorized for adb: restarting the adb server"
                "$adb" kill-server || true
                "$adb" start-server
                unauthorized=0
              fi
            fi
            sleep 3
          done
          [ "$booted" = 1 ] || { echo "::error::the emulator didn't boot"; tail -50 emulator.log; exit 1; }
          sleep 30   # Google TV's home and services settle after the boot

      - name: Switch on and back
        if: steps.changes.outputs.app == 'true'
        run: PATH="$ANDROID_HOME/platform-tools:$PATH" tools/emulator_check.sh emulator-5560 marquise.apk emulator-check

      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.app == 'true'
        with:
          name: emulator-check
          path: |
            emulator-check
            emulator.log
          retention-days: 14
