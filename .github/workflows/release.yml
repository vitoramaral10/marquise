name: Release

# Push a tag like v1.2.0: CI builds, signs with the project's key (repository secrets) and publishes the APK, with the
# CHANGELOG section of that version as the notes. Installs on top of earlier releases (same key).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/marquise.keystore"

      - name: Build
        env:
          MARQUISE_KEYSTORE: ${{ runner.temp }}/marquise.keystore
          MARQUISE_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./build.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          cp marquise.apk "marquise-$version.apk"
          gh release create "$TAG" marquise.apk "marquise-$version.apk" --title "Marquise $version" --notes-file notes.md
