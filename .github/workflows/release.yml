name: Release

# Every merge to main releases by itself when it should: the commits since the last tag decide (Conventional
# Commits: feat → minor, fix/perf → patch, "!" or BREAKING CHANGE → major; docs, chore, ci… → no release). Then the
# manifest's version goes up, CHANGELOG's [Unreleased] becomes the new version, that goes to main as a
# "chore(release)" commit with its tag, and the APK is built, signed with the project's key (repository secrets) and
# published with that CHANGELOG section as the notes. Installs on top of earlier releases (same key).
# main only takes pull requests (the "main" ruleset); this job pushes the release commit and tag with a deploy key
# (secret RELEASE_DEPLOY_KEY), the one actor the ruleset lets through.
# Recovery: if a run tagged a version but didn't publish it, run this workflow by hand with that version; it builds
# the existing tag and publishes it, without planning, committing or tagging anything.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Republish an existing tag (X.Y.Z) whose release is missing; empty = the normal automatic run"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only main: a manual run from another branch would push that branch to main through the deploy key.
    if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: What this merge asks for
        id: plan
        env:
          RECOVER: ${{ inputs.version }}
        run: |
          if [ -n "$RECOVER" ]; then
            [[ "$RECOVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.6.0"; exit 1; }
            git rev-parse -q --verify "refs/tags/v$RECOVER" > /dev/null || { echo "::error::tag v$RECOVER doesn't exist"; exit 1; }
            git checkout -q "v$RECOVER"
            printf 'release=true\nversion=%s\nrecover=true\n' "$RECOVER" | tee -a "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/release.py plan | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Version and CHANGELOG
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.recover != 'true'
        run: python3 .github/scripts/release.py apply "${{ steps.plan.outputs.version }}" "${{ steps.plan.outputs.code }}"

      - uses: actions/setup-java@v4
        if: steps.plan.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        if: steps.plan.outputs.release == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Signing key
        if: steps.plan.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/marquise.keystore"

      - name: Build
        if: steps.plan.outputs.release == 'true'
        env:
          MARQUISE_KEYSTORE: ${{ runner.temp }}/marquise.keystore
          MARQUISE_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./build.sh

      - name: Commit and tag
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.recover != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add app/AndroidManifest.xml CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag -a "v$VERSION" -m "Marquise $VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Publish
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 .github/scripts/release.py notes "$VERSION" > notes.md
          cp marquise.apk "marquise-$VERSION.apk"
          gh release create "v$VERSION" marquise.apk "marquise-$VERSION.apk" --title "Marquise $VERSION" --notes-file notes.md
