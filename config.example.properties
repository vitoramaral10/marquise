# Marquise settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# --- Jellyfin: the posters on the home screen are what was just added to your server.
# The server's address as the TV reaches it. A LAN address over plain HTTP is fine: only this host is allowed without
# HTTPS (e.g. http://192.168.1.10:8096). Empty = no posters.
jellyfin_url=
# An API key: Jellyfin Dashboard -> API Keys -> "+". Keep it out of git (this file's copy, config.properties, is ignored).
jellyfin_key=
# Whose "recently added" (follows that user's libraries and parental controls). Empty = the server's first user.
jellyfin_user=

# --- The apps row, in this order, when installed (up to 8). "live" is the TV's own tuner (over-the-air channels).
# Known keys: jellyfin, live, youtube, netflix, prime, disney, max, appletv, hulu, paramount, peacock, globoplay,
# spotify, f1tv.
shelf=jellyfin,live,youtube,netflix,prime,disney,max,spotify

# --- Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name on the weather card (empty = "Weather").
city=

# auto (follows the TV), en or pt
language=auto

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# --- What Marquise turns off while it's on (never uninstalled; "Original" turns it all back on).
# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working.
disable_assistant=false
# More packages to turn off, comma-separated (system pieces on the protected list are always skipped).
# E.g. com.google.android.videos (the Google TV app), com.tcl.smartalexa (TCL's Alexa), com.tcl.browser.
extra_disable=
